name: libvips-bench

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: benchkey
  AWS_SECRET_ACCESS_KEY: benchsecret
  AWS_REGION: eu-central-1
  S3_BUCKET: journi-bench
  S3_PATH_STYLE: "true"

networks:
  bench:
    driver: bridge

services:

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --address :9000 --console-address :9001
    environment:
      MINIO_ROOT_USER: benchkey
      MINIO_ROOT_PASSWORD: benchsecret
    networks: [bench]
    # infra pinned OFF the cores under test - see BENCH_CPUSET below
    cpuset: "${INFRA_CPUSET:-8-15}"
    tmpfs:
      - /data:size=2g,mode=1777   # storage I/O ~= 0, isolates CPU + injected network delay as the only variables
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    command: ["-host=0.0.0.0"]
    ports:
      - "8474:8474"
    networks: [bench]
    cpuset: "${INFRA_CPUSET:-8-15}"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 2s
      retries: 20
    depends_on:
      minio:
        condition: service_healthy

  # one-shot: creates the toxiproxy "s3" proxy pointing at minio:9000, then
  # applies the latency/bandwidth toxics for LATENCY_PROFILE, via Toxiproxy's
  # HTTP API (curl). Re-run this (docker compose up --force-recreate toxics)
  # to switch profiles. NOTE: runs from a curl+shell image, NOT the toxiproxy
  # image itself - ghcr.io/shopify/toxiproxy is a minimal scratch-based image
  # with no /bin/sh at all (verified: exec fails with "no such file").
  toxics:
    image: curlimages/curl:8.11.1
    entrypoint: ["/bin/sh", "/scripts/apply-toxics.sh"]
    environment:
      TOXIPROXY_URL: http://toxiproxy:8474
      LATENCY_PROFILE: ${LATENCY_PROFILE:-none}
    volumes:
      - ./compose/toxiproxy/apply-toxics.sh:/scripts/apply-toxics.sh:ro
    networks: [bench]
    cpuset: "${INFRA_CPUSET:-8-15}"
    restart: "no"
    depends_on:
      toxiproxy:
        condition: service_healthy

  # one-shot: generates + uploads fixture images, bypassing toxiproxy on
  # purpose - seeding shouldn't be slowed by the injected latency profile.
  # Same image as `bench` (see BENCH_IMAGE below) - just a different entrypoint.
  seed:
    image: "${BENCH_IMAGE:-libvips-bench}"
    build: { context: ., dockerfile: Dockerfile, target: bench }
    entrypoint: ["java", "-jar", "/app/bench.jar", "seed"]
    environment:
      <<: *s3-env
      S3_ENDPOINT: http://minio:9000
      # MUST match `bench`'s BENCH_INPUT_FORMAT - seed only uploads the fixture for ONE
      # format, and bench fetches by that same format's extension (fixtures/baseline.<ext>).
      # A mismatch here means bench's fetch 404s against a key seed never created.
      BENCH_INPUT_FORMAT: ${BENCH_INPUT_FORMAT:-jpg}
    networks: [bench]
    cpuset: "${INFRA_CPUSET:-8-15}"
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  bench:
    # Set BENCH_IMAGE to a pushed registry tag (e.g. yourdockerhubuser/libvips-bench:latest)
    # to pull a pre-built image instead of building from source - `build:` stays
    # here so `docker compose build` still works locally and can tag/push the
    # same image other machines will pull. See README for the push workflow.
    image: "${BENCH_IMAGE:-libvips-bench}"
    build: { context: ., dockerfile: Dockerfile, target: bench }
    platform: linux/amd64
    init: true
    networks: [bench]
    # Use cpuset, NOT `cpus` - Runtime.availableProcessors() (which the
    # cores*2 queue-size convention depends on) reports the full host thread
    # count regardless of a CFS quota set by `--cpus`; only cpuset actually
    # restricts what's visible. Verify these are DISTINCT PHYSICAL cores
    # first (lscpu -e=CPU,CORE) - both target machines are 8C/16T.
    cpuset: "${BENCH_CPUSET:-0-7}"
    mem_limit: 8g
    memswap_limit: 8g   # == mem_limit disables swap; swap would invalidate the memory comparison
    tmpfs:
      - /tmp:size=4g,mode=1777
    environment:
      <<: *s3-env
      S3_ENDPOINT: http://toxiproxy:9000   # always through the proxy, even at zero injected latency,
                                           # so the proxy hop itself is a constant, not a confound
      S3_MAX_CONNECTIONS: "${S3_MAX_CONNECTIONS:-64}"
      S3_TIMEOUT_SECONDS: "${S3_TIMEOUT_SECONDS:-30}"
      BENCH_QUEUE_SIZE: ${BENCH_QUEUE_SIZE:-}
      BENCH_WORKERS: ${BENCH_WORKERS:-}
      BENCH_WARMUP_RUNS: ${BENCH_WARMUP_RUNS:-2}
      BENCH_MIN_RUNS: ${BENCH_MIN_RUNS:-5}
      PROGRESS_ENABLED: ${PROGRESS_ENABLED:-false}
      READ_CALLBACK_DEBUG: ${READ_CALLBACK_DEBUG:-false}
      BENCH_INPUT_FORMAT: ${BENCH_INPUT_FORMAT:-jpg}
      BENCH_OUTPUT_FORMAT: ${BENCH_OUTPUT_FORMAT:-jpg}
      # e.g. BENCH_ENGINES=vips to skip the GM/IM baseline entirely and only run vips variants
      BENCH_ENGINES: ${BENCH_ENGINES:-gm,im,vips}
      # e.g. BENCH_RESIZE_TYPES=standard to skip IM's bleed resize (its own per-job cost runs into
      # the SECONDS, easily 10x+ a standard-resize job - not something a quick iteration loop wants
      # to pay for every time)
      BENCH_RESIZE_TYPES: ${BENCH_RESIZE_TYPES:-standard,bleed}
      # glibc (default) or jemalloc - read by entrypoint.sh, applied via LD_PRELOAD to the WHOLE
      # container (every variant subprocess and every gm/convert child), not just vips, so
      # switching allocators doesn't become "whichever config makes one engine look best".
      BENCH_ALLOCATOR: ${BENCH_ALLOCATOR:-glibc}
      VIPS_CONCURRENCY: "1"   # the already-proven-optimal vips deployment model from earlier bash benchmarking
      RESULTS_DIR: /results
      RUN_ID: ${RUN_ID:-default}
    volumes:
      - ./results:/results
    depends_on:
      minio:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      toxics:
        condition: service_completed_successfully
